<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background circle (optional, let's keep it transparent with a glowing effect) -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" /> <!-- Indigo -->
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" /> <!-- Cyan -->
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Graduation Cap (Top) -->
  <path d="M60 20 L20 40 L60 60 L100 40 Z" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Tassel -->
  <path d="M60 40 C 70 50, 90 40, 95 60" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="95" cy="62" r="4" fill="#F59E0B"/>

  <!-- Pillars (University aesthetic) -->
  <rect x="35" y="55" width="12" height="40" fill="#1E293B" rx="2"/>
  <rect x="54" y="60" width="12" height="35" fill="#1E293B" rx="2"/>
  <rect x="73" y="55" width="12" height="40" fill="#1E293B" rx="2"/>

  <!-- Base of pillars -->
  <path d="M25 95 L95 95 L90 100 L30 100 Z" fill="#475569"/>
  <path d="M30 100 L90 100 L85 105 L35 105 Z" fill="#334155"/>
</svg>
